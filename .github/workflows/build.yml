name: Build and Release Standalone Executable (.exe)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sidecar/pyproject.toml'

      - name: Install Python Sidecar Dependencies & PyInstaller
        run: |
          cd sidecar
          python -m pip install --upgrade pip setuptools wheel
          # CUDA torch MUST install before -e . — installing it after is a
          # silent no-op whenever the CPU wheel -e . pulls in transitively
          # (via iopaint/transformers) happens to match the version number
          # available at the cu128 index: pip sees "already satisfied" and
          # never even downloads the cu128 build. Verified: with this step
          # first, -e . leaves torch/torchvision alone (already satisfies
          # its own unpinned transitive requirement); reversed, every
          # packaged release silently ships CPU-only torch and watermark
          # removal/captioning fail instantly on "Torch not compiled with
          # CUDA enabled". See tests/test_environment.py for the guard.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          python -c "import torch; assert torch.version.cuda is not None, f'CPU-only torch installed: {torch.__version__}'; print(f'torch {torch.__version__} (cuda {torch.version.cuda}) OK')"
          # Deliberately -e . here, not -e ".[dev]" — pytest/httpx are test-only
          # tooling (neither is imported anywhere under app/), and PyInstaller's
          # Analysis phase walks whatever is importable in this environment. Dev
          # extras are installed separately, after packaging, right before the
          # test step that needs them.
          pip install -e .
          python -c "import torch; assert torch.version.cuda is not None, f'CPU-only torch installed: {torch.__version__}'; print(f'torch {torch.__version__} (cuda {torch.version.cuda}) OK after -e .')"
          # Pinned: 6.22.2 collects roughly 6x more data for the sidecar bundle
          # than 6.22.1 (confirmed by an otherwise-identical CLI-invocation build,
          # ~200MB installer vs ~1.2GB) — likely a regression in that patch
          # release. Re-check this pin next time PyInstaller ships a new version.
          pip install pyinstaller==6.22.1

      - name: Build PyInstaller Standalone Sidecar
        run: |
          cd sidecar
          pyinstaller --noconfirm --onedir --name sidecar run.py

      - name: Remove stale bundled CRT DLLs shadowing the system ones
        shell: pwsh
        # Deleting these (rather than filtering via a PyInstaller .spec file)
        # avoids a PyInstaller Analysis-phase regression: invoking PyInstaller via
        # a checked-in .spec instead of the plain CLI form above made it collect
        # roughly 6x more data for reasons that didn't reproduce locally and
        # weren't worth chasing further. See the script for why the DLLs are
        # unsafe to keep. Also run this after any local/manual PyInstaller build.
        run: sidecar/scripts/remove-stale-crt-dlls.ps1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Electron Unit Tests
        run: npm test

      - name: Install Sidecar Test Dependencies
        run: |
          cd sidecar
          pip install -e ".[dev]"

      - name: Run Sidecar Unit Tests
        run: |
          cd sidecar
          python -m pytest tests/ -v

      - name: Build Renderer & Main Process Bundle
        run: npm run build

      - name: Package Standalone Windows Executable & Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Latent-Tools-Windows-Release
          path: release/*.exe
          if-no-files-found: error

      - name: Attach Executables to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
