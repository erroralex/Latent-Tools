name: Build and Release Standalone Executable (.exe)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sidecar/pyproject.toml'

      - name: Install Python Sidecar Dependencies & PyInstaller
        run: |
          cd sidecar
          python -m pip install --upgrade pip setuptools wheel
          # Deliberately -e . here, not -e ".[dev]" — pytest/httpx are test-only
          # tooling (neither is imported anywhere under app/), and PyInstaller's
          # Analysis phase walks whatever is importable in this environment. Dev
          # extras are installed separately, after packaging, right before the
          # test step that needs them.
          pip install -e .
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          # Pinned: 6.22.2 collects roughly 6x more data for the sidecar bundle
          # than 6.22.1 (confirmed by an otherwise-identical CLI-invocation build,
          # ~200MB installer vs ~1.2GB) — likely a regression in that patch
          # release. Re-check this pin next time PyInstaller ships a new version.
          pip install pyinstaller==6.22.1

      - name: Build PyInstaller Standalone Sidecar
        run: |
          cd sidecar
          pyinstaller --noconfirm --onedir --name sidecar run.py

      - name: Remove stale bundled CRT DLLs shadowing the system ones
        shell: pwsh
        run: |
          # PyInstaller auto-collects its own msvcp140.dll/vcruntime140*.dll, older
          # than the CRT torch's c10.dll was built against. Its onedir bootloader
          # searches _internal/ before System32, so the stale bundled copy shadows
          # the correct one and c10.dll crashes with an access violation on load.
          # Deleting them here (rather than filtering via a PyInstaller .spec file)
          # avoids a PyInstaller Analysis-phase regression: invoking PyInstaller via
          # a checked-in .spec instead of the plain CLI form above made it collect
          # roughly 6x more data for reasons that didn't reproduce locally and
          # weren't worth chasing further. Universal CRT DLLs ship with Windows
          # 10/11 by default, so it's safe to rely on the system copies instead.
          Remove-Item -Force -ErrorAction SilentlyContinue `
            sidecar/dist/sidecar/_internal/msvcp140.dll, `
            sidecar/dist/sidecar/_internal/vcruntime140.dll, `
            sidecar/dist/sidecar/_internal/vcruntime140_1.dll

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Electron Unit Tests
        run: npm test

      - name: Install Sidecar Test Dependencies
        run: |
          cd sidecar
          pip install -e ".[dev]"

      - name: Run Sidecar Unit Tests
        run: |
          cd sidecar
          python -m pytest tests/ -v

      - name: Build Renderer & Main Process Bundle
        run: npm run build

      - name: Package Standalone Windows Executable & Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Latent-Tools-Windows-Release
          path: release/*.exe
          if-no-files-found: error

      - name: Attach Executables to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
