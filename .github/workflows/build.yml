name: Build and Release Standalone Executable (.exe)

on:
  push:
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Standalone (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sidecar/pyproject.toml'

      - name: Install Python Sidecar Dependencies & PyInstaller
        run: |
          cd sidecar
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cu128
          pip install pyinstaller

      - name: Build PyInstaller Standalone Sidecar
        run: |
          cd sidecar
          pyinstaller --noconfirm --onedir --name sidecar run.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Run Electron Unit Tests
        run: npm test

      - name: Run Sidecar Unit Tests
        run: |
          cd sidecar
          python -m pytest tests/ -v

      - name: Build Renderer & Main Process Bundle
        run: npm run build

      - name: Package Standalone Windows Executable & Installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Latent-Tools-Windows-Release
          path: release/*.exe
          if-no-files-found: error

      - name: Attach Executables to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
