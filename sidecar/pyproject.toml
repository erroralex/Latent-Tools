[project]
name = "latent-tools-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.108.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pillow==9.5.0",
    "numpy<2.0",
    # Unpinned deliberately: pinning ">=4.10" here is ResolutionImpossible
    # together with numpy<2.0 (iopaint's opencv/numpy chain needs an
    # opencv-python-headless build old enough to accept numpy<2). Letting
    # pip pick resolved to 4.11.0.86 in verification; the floor isn't load-
    # bearing for anything this project calls today.
    "opencv-python-headless",
    "iopaint>=1.6",
    "transformers>=4.45",
    "einops>=0.8",
    "timm>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx==0.27.2"]

[tool.pytest.ini_options]
markers = ["gpu: real-model tests requiring a CUDA GPU (skipped by default)"]
addopts = "-m 'not gpu'"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
